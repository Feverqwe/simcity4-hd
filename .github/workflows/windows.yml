name: Windows build

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare Qt and MinGW
        run: ./installer/ci-qt.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'qt-kit')
      - name: Configure the C toolchain for the builder
        shell: pwsh
        run: |
          $mingw = Join-Path $env:RUNNER_TEMP 'qt-kit/Tools/mingw1310_64/bin'
          $mingw >> $env:GITHUB_PATH
          'CGO_ENABLED=1' >> $env:GITHUB_ENV
          'CC=gcc' >> $env:GITHUB_ENV
      - name: Check Go sources
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
      - name: Build and check the installer backend
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -cnotmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?$') {
            throw 'Expected a version tag such as v1.2.3 or v1.2.3-rc.1.'
          }
          $backend = Join-Path $env:RUNNER_TEMP 'simcity4-uhd-windows-amd64.exe'
          go build -trimpath -ldflags "-X main.version=$version -extldflags=-static" -o $backend .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = & $backend --version
          if ($LASTEXITCODE -ne 0 -or $actual -cne $version) {
            throw "Expected embedded version $version, got $actual."
          }
      - name: Build the self-contained installer
        run: |
          $qt = Join-Path $env:RUNNER_TEMP 'qt-kit'
          $env:Path = "$(Join-Path $qt 'bin');$(Join-Path $qt 'Tools/mingw1310_64/bin');$env:Path"
          $backend = Join-Path $env:RUNNER_TEMP 'simcity4-uhd-windows-amd64.exe'
          $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $backend).Hash.ToLowerInvariant()
          ./installer/package.ps1 -QtRoot $qt -Backend $backend -Output dist/SimCity4UHD-Setup.exe
          $name = 'SimCity4UHD-Setup.exe'
          $runtime = Join-Path $env:RUNNER_TEMP "setup-$([Guid]::NewGuid())"
          $extract = Start-Process -FilePath "dist/$name" -Wait -PassThru -ArgumentList @('--extract-to', ('"{0}"' -f $runtime))
          if ($extract.ExitCode -ne 0 -or
              (Get-FileHash -Algorithm SHA256 (Join-Path $runtime 'app.exe')).Hash.ToLowerInvariant() -cne $expected) {
            throw 'The self-contained setup does not contain the verified builder.'
          }
          $pack = Join-Path $runtime 'Russian/russian.sc4pack'
          $source = (Get-FileHash -Algorithm SHA256 -LiteralPath 'installer/resources/russian.sc4pack').Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $pack).Hash -cne $source) {
            throw 'The self-contained setup contains a different Russian language pack.'
          }
          & (Join-Path $runtime 'app.exe') russian-pack unpack $pack (Join-Path $runtime 'russian-check')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $runtime -Recurse
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$name").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/$name.sha256"), "$hash  $name`n")
      - uses: actions/upload-artifact@v4
        with:
          name: simcity4-uhd-windows-installer
          path: |
            dist/SimCity4UHD-Setup.exe
            dist/SimCity4UHD-Setup.exe.sha256
          if-no-files-found: error

  release:
    needs: installer
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simcity4-uhd-windows-installer
          path: release
      - name: Publish verified Windows build
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SimCity4UHD-Setup.exe.sha256
          flags=(--verify-tag --generate-notes)
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}" \
            SimCity4UHD-Setup.exe SimCity4UHD-Setup.exe.sha256
